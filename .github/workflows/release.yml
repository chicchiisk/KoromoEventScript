name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "既存のリリースタグ（例: v0.1.0）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release assets
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $env:MANUAL_TAG
          } else {
            $env:PUSH_TAG
          }
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Release tag must use v<SemVer>: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($Matches.version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release versions
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          [xml]$cliProject = Get-Content -Raw "source/cli/KoromoEventScript.Cli/KoromoEventScript.Cli.csproj"
          $cliVersion = [string]$cliProject.Project.PropertyGroup.Version
          $unityPackage = Get-Content -Raw "source/extension/unity/Package/package.json" | ConvertFrom-Json
          if ($cliVersion -ne $env:RELEASE_VERSION) {
            throw "CLI version '$cliVersion' does not match tag version '$env:RELEASE_VERSION'."
          }
          if ($unityPackage.version -ne $env:RELEASE_VERSION) {
            throw "Unity package version '$($unityPackage.version)' does not match tag version '$env:RELEASE_VERSION'."
          }

      - name: Test .NET projects
        shell: pwsh
        run: >-
          dotnet test KoromoEventScript.slnx
          --configuration Release
          --disable-build-servers
          --maxcpucount:1

      - name: Build CLI release package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          ./scripts/release/Publish-KesCli.ps1 -Version $env:RELEASE_VERSION

      - name: Build Unity UPM package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $outputRoot = "artifacts/release/unity"
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          $packedName = npm pack "source/extension/unity/Package" --pack-destination $outputRoot |
            Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) {
            throw "npm pack failed for the Unity package."
          }
          $packedPath = Join-Path $outputRoot $packedName.Trim()
          $releasePath = Join-Path $outputRoot "kes-unity-$env:RELEASE_VERSION.tgz"
          Move-Item -LiteralPath $packedPath -Destination $releasePath -Force

      - name: Assemble release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $assetRoot = "artifacts/release/assets"
          New-Item -ItemType Directory -Force -Path $assetRoot | Out-Null
          Copy-Item -LiteralPath "artifacts/release/cli/kes-$env:RELEASE_VERSION-win-x64.zip" -Destination $assetRoot
          Copy-Item -LiteralPath "artifacts/release/unity/kes-unity-$env:RELEASE_VERSION.tgz" -Destination $assetRoot
          $checksumLines = Get-ChildItem -LiteralPath $assetRoot -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
            }
          [System.IO.File]::WriteAllLines(
            (Join-Path $assetRoot "SHA256SUMS.txt"),
            $checksumLines,
            [System.Text.UTF8Encoding]::new($false))

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          $assets = Get-ChildItem -LiteralPath "artifacts/release/assets" -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            $arguments = @(
              "release", "create", $env:RELEASE_TAG,
              "--verify-tag",
              "--title", "KES $env:RELEASE_VERSION",
              "--generate-notes"
            )
            if ($env:IS_PRERELEASE -eq "true") {
              $arguments += "--prerelease"
            }
            $arguments += $assets
            gh @arguments
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed."
          }
